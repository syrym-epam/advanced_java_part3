services:
  sport-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB_SPORT}
      POSTGRES_USER:  ${POSTGRES_USER}
      POSTGRES_PASSWORD:  ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432" 
    volumes:
      - ./init-scripts/sport-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_SPORT}"]
      interval: 5s
      timeout: 5s
      retries: 5   
  sport-service:
    build:
      context: ./
      dockerfile: Dockerfile
    environment: 
      - SPRING_DATASOURCE_URL=${SPORT_SERVICE_DATASOURCE_URL}      
      - SPRING_DATASOURCE_USER=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASS=${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'; echo $?"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      sport-db:
        condition: service_healthy